[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "response-privacy-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35", "httpx>=0.28,<0.29", "numpy>=2.2,<2.3", "pandas>=2.2,<2.3", "scikit-learn>=1.6,<1.7", "scipy>=1.14,<1.16", "matplotlib>=3.10,<3.11", "joblib>=1.4,<1.5"]

[project.optional-dependencies]
test = ["pytest>=8.3,<8.4"]

[project.scripts]
privacy-lab = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "detector*", "scenarios*", "ground_truth*", "pipeline*", "models*", "evaluation*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

